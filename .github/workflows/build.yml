name: Build

# GitHub only reads workflows from the repository root's .github/, so this file lives here even though
# the Gradle project itself is in mods/chartalandlords (that is what `defaults.run.working-directory`
# below is for). The steps mirror the verification chains documented in README.md:
#   1) ./gradlew build             - compile + package (the jar the release is made of)
#   2) ./gradlew runGameTestServer - 36 GameTests against a real, headless server
#   3) tools/logic-check.ps1       - 472 assertions on the Minecraft-free rule engine (milliseconds)
# The asset check (tools/check_assets.py) needs Python + Pillow, so it is only run locally for now.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: mods/chartalandlords

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    env:
      # A cold ModDevGradle run downloads Minecraft/NeoForge and then decompiles + remaps them, which
      # does not fit in the MDK's default -Xmx1G (gradle.properties). Override it for CI runs.
      # --no-daemon 让构建跑在启动器 JVM 里，所以堆必须给在 GRADLE_OPTS 上；
      # 只写 -Dorg.gradle.jvmargs 是给守护进程的，无守护时没人读它（上一版 CI 就是这么 OOM 的：
      # 日志有 task 列表、没有 FAILURE 区块、退出码 1）。
      GRADLE_OPTS: '-Xmx3G -XX:MaxMetaspaceSize=1G -Dorg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --console=plain --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Game tests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain --no-daemon --stacktrace 2>&1 | tee gradle-gametest.log

      - name: Pure-logic checks (rule engine, no Minecraft)
        working-directory: .
        # Invoke through `pwsh -File` instead of `./script.ps1`: the runner's checkout does not need
        # the executable bit on the .ps1 for this (the call operator / dot-slash form does).
        # Tee to a log as well: when this step failed on the runner there was no captured output at
        # all, so the failure report below could only show the (successful) Gradle logs.
        run: |
          set -o pipefail
          pwsh -NoProfile -File tools/logic-check.ps1 2>&1 | tee logic-check.log

      # A failed Gradle run only tells the log reader "exit code 1". Earlier this step dumped the last
      # 30 lines, which for a ModDevGradle run is cache-maintenance noise - the real error sits earlier
      # in the log. Grep for the patterns that actually carry the failure instead.
      - name: Report failures
        # The Gradle logs live under mods/chartalandlords (defaults.run.working-directory), the
        # logic-check log at the repository root - work from the root and name both fully.
        working-directory: .
        if: failure()
        run: |
          PATTERN='FAILURE|What went wrong|error:|error \[|Caused by:|Exception|Compilation failed|Could not|BUILD FAILED|All [0-9]+ required tests passed|Missing or unsupported'
          for log in mods/chartalandlords/gradle-build.log mods/chartalandlords/gradle-gametest.log logic-check.log; do
            [ -f "$log" ] || continue
            echo "=== $log: failure lines ==="
            matches=$(grep -nE "$PATTERN" "$log" | tail -n 40 || true)
            if [ -z "$matches" ]; then
              echo "(no failure lines matched; last 15 lines follow)"
              matches=$(tail -n 15 "$log" || true)
            fi
            printf '%s\n' "$matches"
            printf '%s\n' "$matches" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=${log}::${line}"
            done
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            mods/chartalandlords/gradle-*.log
            logic-check.log
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: charta-landlords-jar
          path: mods/chartalandlords/build/libs/*.jar
          if-no-files-found: error